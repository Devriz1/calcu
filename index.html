<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GST Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#F5F7F2;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    .container{
      width:100%;
      max-width:520px;
    }

    .card{
      background:white;
      border-radius:32px;
      padding:40px;
      border:1px solid #D9E2D0;
    }

    h1{
      font-size:40px;
      line-height:1.1;
      color:#163300;
      margin-bottom:12px;
      font-weight:700;
    }

    .subtitle{
      color:#5B6B5F;
      font-size:16px;
      line-height:1.6;
      margin-bottom:32px;
    }

    .section{
      margin-bottom:24px;
    }

    label{
      display:block;
      margin-bottom:10px;
      font-size:15px;
      font-weight:600;
      color:#163300;
    }

    input,
    select{
      width:100%;
      height:58px;
      border:1px solid #D9E2D0;
      border-radius:18px;
      padding:0 18px;
      font-size:16px;
      font-family:'Inter',sans-serif;
      outline:none;
      transition:0.2s;
      background:white;
      color:#163300;
    }

    input:focus,
    select:focus{
      border-color:#9FE870;
      box-shadow:0 0 0 4px rgba(159,232,112,0.25);
    }

    .radio-group{
      display:flex;
      gap:14px;
    }

    .radio-card{
      flex:1;
    }

    .radio-card input{
      display:none;
    }

    .radio-card label{
      height:56px;
      border:1px solid #D9E2D0;
      border-radius:18px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      background:white;
      transition:0.2s;
      font-weight:600;
      margin-bottom:0;
    }

    .radio-card input:checked + label{
      background:#9FE870;
      border-color:#9FE870;
      color:#163300;
    }

    .result-box{
      background:#F5F7F2;
      border-radius:24px;
      padding:24px;
      margin-top:30px;
    }

    .result-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .result-row:last-child{
      margin-bottom:0;
      padding-top:18px;
      border-top:1px solid #D9E2D0;
    }

    .result-title{
      color:#5B6B5F;
      font-size:15px;
    }

    .result-value{
      color:#163300;
      font-size:18px;
      font-weight:700;
    }

    .total{
      font-size:24px;
      color:#163300;
    }

    @media(max-width:600px){

      .card{
        padding:28px;
      }

      h1{
        font-size:32px;
      }

      .radio-group{
        flex-direction:column;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>GST Calculator</h1>

      <p class="subtitle">
        Instantly calculate GST with a clean and modern interface inspired by Wise.
      </p>

      <div class="section">

        <label>Amount</label>

        <input 
          type="number"
          id="amount"
          placeholder="Enter amount"
          oninput="calculateGST()"
        >

      </div>

      <div class="section">

        <label>GST Rate</label>

        <select id="gst" onchange="calculateGST()">

          <option value="5">5%</option>

          <option value="12">12%</option>

          <option value="18" selected>18%</option>

          <option value="28">28%</option>

        </select>

      </div>

      <div class="section">

        <label>Calculation Type</label>

        <div class="radio-group">

          <div class="radio-card">

            <input 
              type="radio"
              id="exclusive"
              name="type"
              value="exclusive"
              checked
              onchange="calculateGST()"
            >

            <label for="exclusive">
              Excluding GST
            </label>

          </div>

          <div class="radio-card">

            <input 
              type="radio"
              id="inclusive"
              name="type"
              value="inclusive"
              onchange="calculateGST()"
            >

            <label for="inclusive">
              Including GST
            </label>

          </div>

        </div>

      </div>

      <div class="result-box">

        <div class="result-row">

          <span class="result-title">
            GST Amount
          </span>

          <span class="result-value" id="gstAmount">
            ₹0.00
          </span>

        </div>

        <div class="result-row">

          <span class="result-title">
            Base Amount
          </span>

          <span class="result-value" id="baseAmount">
            ₹0.00
          </span>

        </div>

        <div class="result-row">

          <span class="result-title">
            Total Amount
          </span>

          <span class="result-value total" id="totalAmount">
            ₹0.00
          </span>

        </div>

      </div>

    </div>

  </div>

  <script>

    function calculateGST(){

      const amount =
        parseFloat(
          document.getElementById('amount').value
        ) || 0;

      const gstRate =
        parseFloat(
          document.getElementById('gst').value
        );

      const type =
        document.querySelector(
          'input[name="type"]:checked'
        ).value;

      let gstAmount = 0;
      let baseAmount = 0;
      let totalAmount = 0;

      if(type === "exclusive"){

        gstAmount =
          (amount * gstRate) / 100;

        baseAmount = amount;

        totalAmount =
          amount + gstAmount;

      }

      else{

        totalAmount = amount;

        baseAmount =
          amount / (1 + gstRate / 100);

        gstAmount =
          amount - baseAmount;

      }

      document.getElementById('gstAmount').innerText =
        "₹" + gstAmount.toFixed(2);

      document.getElementById('baseAmount').innerText =
        "₹" + baseAmount.toFixed(2);

      document.getElementById('totalAmount').innerText =
        "₹" + totalAmount.toFixed(2);

    }

  </script>

</body>
</html>
